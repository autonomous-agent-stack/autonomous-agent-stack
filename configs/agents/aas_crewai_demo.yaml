{
  "id": "aas_crewai_demo",
  "kind": "process",
  "entrypoint": "drivers/crewai_adapter.py",
  "version": "0.1",
  "execution_semantics": "patch",
  "capabilities": [
    "crewai",
    "produce_patchable_changes"
  ],
  "default_mode": "apply_in_workspace",
  "policy_defaults": {
    "timeout_sec": 120,
    "max_steps": 3,
    "network": "disabled",
    "network_allowlist": [],
    "tool_allowlist": ["read", "write", "bash"],
    "allowed_paths": ["apps/**", "docs/**", "tests/**"],
    "forbidden_paths": [
      ".git/**",
      "logs/**",
      ".masfactory_runtime/**",
      "memory/**",
      "**/*.key",
      "**/*.pem"
    ],
    "max_changed_files": 5,
    "max_patch_lines": 1000,
    "allow_binary_changes": false,
    "cleanup_on_success": true,
    "retain_workspace_on_failure": true
  },
  "metadata": {
    "description": "CrewAI 演示 agent：经 AAS runner 隔离运行并产出可审计 patch。 / CrewAI demo agent: runs through the isolated AAS runner and produces an auditable patch.",
    "crewai": {
      "entrypoint": "examples.crewai_agents.aas_crewai_demo.crew",
      "require_package": false
    }
  }
}
