description: "中文：用 Agent-Reach 读取公开资料，并用 CrewAI 风格流程整理研究产物。 English: Reads public material through Agent-Reach and organizes a research artifact with a CrewAI-style workflow."
enabled: true
input_schema:
  type: object
  properties:
    prompt:
