output_schema:
  type: object
  properties:
    summary:
      type: string
    sources:
      type: array
risk_tier: common_read
policy_refs:
  - tool_proxy.read_only
artifact_types:
  - report
lease_enabled: true
metadata:
  public_repo_safe: true
  private_credentials_required: false
