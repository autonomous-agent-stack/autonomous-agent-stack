{
  "id": "a2a",
  "kind": "runtime",
  "service": "autoresearch.core.services.aep_process_runtime_adapter:AepProcessRuntimeAdapterService",
  "version": "1.0",
  "runtime_type": "federated_agent",
  "display_name": "A2A federated agent bridge",
  "enabled": true,
  "optional_dependencies": ["a2a"],
  "capabilities": ["create_session", "run", "stream", "cancel", "status"],
  "aep_bridge": {
    "jobspec_inputs": ["run_id", "agent_id", "task", "policy.timeout_sec", "metadata.a2a"],
    "result_fields": ["status", "summary", "output_artifacts", "metrics", "error"],
    "workspace_binding": "RuntimeRunRequest.prompt -> AEP JobSpec.task",
    "artifact_bindings": ["A2A task result -> DriverResult.output_artifacts"]
  },
  "metadata": {
    "agent_id": "a2a_bridge",
    "lane": "runtime_adapter_v1",
    "role": "federated_agent",
    "ledger_policy": "reuse federation lease, quota, and audit"
  }
}
