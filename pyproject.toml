[project]
name = "autonomous-agent-stack"
version = "0.1.0"
description = "Evergreen governed control plane for durable agent execution"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["agents", "control-plane", "governance", "automation"]

[project.urls]
Homepage = "https://github.com/autonomous-agent-stack/autonomous-agent-stack"
Documentation = "https://github.com/autonomous-agent-stack/autonomous-agent-stack/tree/main/docs"
Issues = "https://github.com/autonomous-agent-stack/autonomous-agent-stack/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/adapters",
    "src/autoresearch",
    "src/bridge",
    "src/content_kb",
    "src/excel_audit",
    "src/executors",
    "src/foundation",
    "src/gatekeeper",
    "src/gateway",
    "src/github_admin",
    "src/integrations",
    "src/malu_landing",
    "src/masfactory",
    "src/memory",
    "src/opensage",
    "src/orchestrator",
    "src/security",
    "src/skills",
    "src/vision",
    "src/workflow",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 10
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
]
