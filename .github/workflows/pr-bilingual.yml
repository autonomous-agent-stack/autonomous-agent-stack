# Documentation i18n check: active docs are language-separated and portable.
name: Docs i18n

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  docs-i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Draft PRs: allow WIP; enforce when marked ready (ready_for_review) or non-draft edits.
    if: |
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-bilingual-check') &&
      !github.event.pull_request.draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify docs i18n and portable paths
        run: python3 scripts/ci/check_pr_bilingual.py
